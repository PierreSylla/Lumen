[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-hue"
version = "0.6.0"
description = "Desktop control for Philips Hue (Wayland/Hyprland), via the local CLIP v2 API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GNU GPLv3" }
dependencies = [
    "PySide6>=6.5",
    "requests>=2.28",
]

[project.scripts]
hue = "huectl.cli:main"
hue-gui = "huectl.app:main"

[tool.setuptools]
packages = ["huectl"]
