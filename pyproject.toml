[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-hue"
version = "0.8.0"
description = "Desktop control for Philips Hue (Wayland/Hyprland) via the local CLIP v2 API, with screen-sync ambilight"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "PySide6>=6.5",
    "requests>=2.28",
    "pywebview>=5.0",
    "pystray>=0.19",
    "pillow",
]


# pystray's Linux tray icon needs a GTK/AppIndicator backend at runtime:
#   Arch: sudo pacman -S python-pystray python-pillow libayatana-appindicator

[project.optional-dependencies]
# Packaging hue-webui only (see packaging/lumen-webui.spec) - not needed to
# develop or run the app. AUR-only on Arch (`paru -S pyinstaller`); a plain
# venv with `pip install pyinstaller` works just as well and needs no sudo.
dev = ["pyinstaller>=6.0"]

[project.scripts]
hue = "huectl.cli:main"
hue-sync = "huectl.sync:main"
hue-webui = "huectl.webapp:main"

[tool.setuptools]
packages = ["huectl"]
[tool.setuptools.package-data]
huectl = ["webui_dist/**/*"]
