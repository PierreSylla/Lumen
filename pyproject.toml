[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-hue"
version = "0.7.0"
description = "Desktop control for Philips Hue (Wayland/Hyprland), via the local CLIP v2 API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "PySide6>=6.5",
    "requests>=2.28",
]

# Screen sync (Entertainment) needs the `openssl` binary at runtime for its
# DTLS-PSK transport - no extra Python package required.

[project.scripts]
hue = "huectl.cli:main"
hue-gui = "huectl.app:main"
hue-sync = "huectl.sync:main"

[tool.setuptools]
packages = ["huectl"]
